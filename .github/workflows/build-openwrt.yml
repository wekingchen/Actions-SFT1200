name: SFT1200 固件编译

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH 连接到 Actions（调试用）'
        required: false
        default: 'false'

permissions:
  contents: read

concurrency:
  group: sft1200-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REPO_URL: https://github.com/201821143044/gl-infra-builder-new
  REPO_BRANCH: main
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: true
  UPLOAD_FIRMWARE: false
  UPLOAD_COWTRANSFER: false
  UPLOAD_WETRANSFER: false
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  # OpenWrt 18.06 ccache settings. "content" avoids misses when the rebuilt
  # compiler has identical bytes but a different timestamp.
  CCACHE_COMPILERCHECK: content
  CCACHE_MAXSIZE: 512M

jobs:
  preflight:
    name: 构建前快速预检
    runs-on: ubuntu-22.04
    outputs:
      naiveproxy_version: ${{ steps.naiveproxy-metadata.outputs.version }}
      naiveproxy_release: ${{ steps.naiveproxy-metadata.outputs.release }}
      naiveproxy_asset: ${{ steps.naiveproxy-metadata.outputs.asset }}
      naiveproxy_sha256: ${{ steps.naiveproxy-metadata.outputs.sha256 }}
      naiveproxy_url: ${{ steps.naiveproxy-metadata.outputs.url }}
      pwpackages_commit: ${{ steps.naiveproxy-metadata.outputs.pwpackages_commit }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 静态预检
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "检查 GitHub Actions 与 Shell"
          command -v shellcheck >/dev/null 2>&1 || {
            echo "预检错误：runner 缺少 shellcheck"
            exit 1
          }

          actionlint_version="1.7.12"
          actionlint_sha256="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          actionlint_archive="$RUNNER_TEMP/actionlint.tar.gz"
          actionlint_dir="$RUNNER_TEMP/actionlint"

          curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors \
            "https://github.com/rhysd/actionlint/releases/download/v${actionlint_version}/actionlint_${actionlint_version}_linux_amd64.tar.gz" \
            -o "$actionlint_archive"
          printf '%s  %s\n' "$actionlint_sha256" "$actionlint_archive" | sha256sum -c -
          rm -rf "$actionlint_dir"
          mkdir -p "$actionlint_dir"
          tar -xzf "$actionlint_archive" -C "$actionlint_dir"

          "$actionlint_dir/actionlint" \
            -shellcheck="shellcheck -S error" \
            -pyflakes= \
            .github/workflows/*.yml

          # 独立脚本也做 ShellCheck；只把 error 级问题作为阻断条件，
          # 避免风格类 warning/noise 影响旧项目的稳定构建。
          shellcheck -S error "$DIY_P1_SH" "$DIY_P2_SH" scripts/archive-config.sh

          echo "检查脚本语法"
          bash -n "$DIY_P1_SH"
          bash -n "$DIY_P2_SH"
          bash -n scripts/archive-config.sh
          python3 -m py_compile scripts/patch-gen-config.py scripts/resolve-naiveproxy-release.py

          echo "检查项目级兼容约束"
          python3 - <<'PY'
          from pathlib import Path
          import re

          workflow = Path(".github/workflows/build-openwrt.yml").read_text()
          checker = Path(".github/workflows/update-checker.yml").read_text()
          diy1 = Path("diy-part1.sh").read_text()
          diy2 = Path("diy-part2.sh").read_text()
          archive_config = Path("scripts/archive-config.sh").read_text()
          patch_gen_config = Path("scripts/patch-gen-config.py").read_text()
          resolve_naiveproxy = Path("scripts/resolve-naiveproxy-release.py").read_text()
          config = Path(".config").read_text()

          # 分离具体 job，避免安全断言误扫到其他 job 或 Preflight 自身文本。
          build_marker = "\n  build:\n"
          release_marker = "\n  release:\n"
          if build_marker not in workflow or release_marker not in workflow:
              raise SystemExit("预检错误：找不到 build / release job")
          preflight, remainder = workflow.split(build_marker, 1)
          build, release = remainder.split(release_marker, 1)

          def require(condition, message):
              if not condition:
                  raise SystemExit(f"预检错误：{message}")

          def get_step(job, name):
              pattern = re.compile(
                  rf"(?ms)^ {{4,6}}- name: {re.escape(name)}\n(?P<body>.*?)(?=^ {{4,6}}- name: |\Z)"
              )
              match = pattern.search(job)
              require(match is not None, f"找不到 workflow step：{name}")
              return " ".join(match.group("body").split())

          # setup.py 内部会创建 Git 提交，身份必须在调用前设置。
          setup_pos = build.find("python3 setup.py")
          name_pos = build.find('export GIT_AUTHOR_NAME="GitHub Actions"')
          email_pos = build.find('export GIT_AUTHOR_EMAIL=')
          require(setup_pos >= 0, "找不到 setup.py 调用")
          require(0 <= name_pos < setup_pos, "Git author name 没有在 setup.py 前设置")
          require(0 <= email_pos < setup_pos, "Git author email 没有在 setup.py 前设置")

          # 权限隔离：preflight/build 只读；只有不执行第三方构建代码的 release job 可以写。
          workflow_header = workflow.split("\njobs:\n", 1)[0]
          require("permissions:\n  contents: read\n" in workflow_header,
                  "workflow 顶层 permissions 不是 contents: read")
          require("actions: write" not in workflow_header and "contents: write" not in workflow_header,
                  "workflow 顶层仍授予写权限")
          require("permissions:\n      contents: read\n" in build,
                  "build job 不是 contents: read")
          require("actions: write" not in build and "contents: write" not in build,
                  "build job 仍持有写权限")
          require(
              "permissions:\n      actions: write\n      contents: write\n" in release,
              "release job 缺少 actions: write / contents: write",
          )

          preflight_checkout = get_step(preflight, "检出仓库")
          build_checkout = get_step(build, "检出仓库")
          require("persist-credentials: false" in preflight_checkout,
                  "Preflight checkout 仍持久化 GitHub 凭据")
          require("persist-credentials: false" in build_checkout,
                  "build checkout 仍持久化 GitHub 凭据")
          require("secrets.GITHUB_TOKEN" not in build and "github.token" not in build,
                  "build job 仍直接持有 GitHub token")

          # hostpkg 的 LD_LIBRARY_PATH 只能局部提供给 make，不能跨步骤污染宿主工具。
          require('echo "LD_LIBRARY_PATH=' not in diy2,
                  "diy-part2 仍把 LD_LIBRARY_PATH 写入 GITHUB_ENV")
          require("export LD_LIBRARY_PATH=" not in diy2,
                  "diy-part2 仍全局 export LD_LIBRARY_PATH")
          require('LD_LIBRARY_PATH="$make_ld_library_path" make -j$(nproc)' in build,
                  "并行编译未局部注入 hostpkg LD_LIBRARY_PATH")
          require('env LD_LIBRARY_PATH="$make_ld_library_path"' in build,
                  "诊断重试未局部注入 hostpkg LD_LIBRARY_PATH")

          # 通用语法/表达式错误交给 actionlint + shellcheck。
          require("actionlint_version=\"1.7.12\"" in preflight,
                  "Preflight 缺少固定版本 actionlint")
          require("shellcheck -S error" in preflight,
                  "Preflight 缺少 shellcheck error 级检查")
          require("sha256sum -c -" in preflight,
                  "actionlint 下载缺少 SHA256 校验")

          # 失败诊断必须有时间边界并优先定向重跑；具体超时值属于可调参数，不在此写死。
          require("timeout-minutes:" in build,
                  "build job 缺少总时长上限")
          require("diagnostic_timeout=" in build,
                  "失败诊断缺少独立超时上限")
          require('make "$failed_target" -j1 V=s' in build,
                  "失败诊断没有优先重跑失败目标")
          require('"$diagnostic_timeout"' in build and "timeout " in build,
                  "失败诊断 timeout 保护缺失")
          require("(package|tools|toolchain)" in build,
                  "失败目标提取未覆盖 package / tools / toolchain")

          # cache 必须使用 restore/save 分离模式，避免 post-save 重复逻辑。
          require("actions/cache/restore@v6" in build, "缺少 cache restore")
          require("actions/cache/save@v6" in build, "缺少 cache save")
          require("uses: actions/cache@v6" not in build, "仍存在旧的一体式 cache action")
          require("sft1200-" + "ccache-" not in build,
                  "仍残留已弃用的旧 ccache 缓存前缀")

          # 编译依赖下载必须独立失败，不能藏在 apt-get 的命令替换里。
          require("apt-get -qq install $(" + "curl" not in build,
                  "编译依赖仍通过命令替换下载，curl 失败可能被静默吞掉")
          require('deps_file="$RUNNER_TEMP/openwrt-build-deps.txt"' in build,
                  "缺少编译依赖临时文件")
          require('[ ! -s "$deps_file" ]' in build,
                  "编译依赖下载后缺少非空校验")
          require('apt-get -qq install "${build_deps[@]}"' in build,
                  "编译依赖没有使用校验后的数组安装")

          # gen_config 兼容补丁必须保持可审查，禁止重新藏回 base64。
          require("base64.b64decode" not in build,
                  "gen_config 兼容补丁仍使用不可审查的 base64 内联代码")
          require('scripts/patch-gen-config.py' in build,
                  "workflow 未调用可审查的 gen_config 补丁脚本")
          require("Compatibility hook for GL-SFT1200" in patch_gen_config,
                  "gen_config 补丁脚本缺少兼容钩子标记")
          for required in (
              "dnsmasq_full_nftset:nftables-json",
              "samba4",
              "python3-cryptodome",
              "python3-requests",
              "python3-aiohttp",
              "python3-sentry-sdk",
          ):
              require(required in patch_gen_config,
                      f"gen_config 补丁脚本缺少关键兼容项：{required}")

          # NaiveProxy Release API 只允许在只读 Preflight 中查询；
          # build 只消费 digest/URL，不得持有 GitHub token。
          require("api.github.com/repos/klzgrad/naiveproxy/releases/tags/" in resolve_naiveproxy,
                  "NaiveProxy resolver 未读取 GitHub Release 元数据")
          require('item.get("digest")' in resolve_naiveproxy,
                  "NaiveProxy resolver 未读取 Release asset digest")
          require("NAIVEPROXY_META_SHA256" in diy2 and "NAIVEPROXY_META_URL" in diy2,
                  "diy-part2 未消费 Preflight 的 NaiveProxy 元数据")
          require("GH_TOKEN" not in diy2 and "GITHUB_TOKEN" not in diy2,
                  "diy-part2 仍尝试读取 GitHub token")
          require("NaiveProxy SHA256 verified by GitHub Release digest" in diy2,
                  "NaiveProxy 缺少官方 digest 强校验")
          require('if [ "$actual_sha" != "$expected_sha" ]' in diy2,
                  "NaiveProxy 下载内容没有与官方 digest 强制比较")
          require('sha256="$(sha256sum "$archive"' not in diy2,
                  "NaiveProxy 仍使用下载结果自生成 PKG_HASH")
          require(".sft1200-naiveproxy.env" in diy2,
                  "NaiveProxy 缺少构建追溯元数据")
          require(".sft1200-naiveproxy.env" in archive_config,
                  "配置留档未记录 NaiveProxy 追溯元数据")

          naive_meta_step = get_step(preflight, "获取 NaiveProxy 官方 digest")
          require("GH_TOKEN:" in naive_meta_step and "github.token" in naive_meta_step,
                  "NaiveProxy 元数据查询没有使用 Preflight 只读 token")
          require("resolve-naiveproxy-release.py" in naive_meta_step,
                  "Preflight 未调用 NaiveProxy resolver")
          require("pwpackages_commit" in naive_meta_step and "git -C" in naive_meta_step,
                  "Preflight 未记录 PWpackages 源码快照")

          pwpackages_snapshot_step = get_step(build, "固定 Passwall Packages 构建快照")
          require("needs.preflight.outputs.pwpackages_commit" in pwpackages_snapshot_step,
                  "build 未消费 Preflight 的 PWpackages commit")
          require("checkout --detach" in pwpackages_snapshot_step,
                  "build 未固定 PWpackages 源码快照")
          require("cat-file -e" in pwpackages_snapshot_step and "fetch --depth=1" in pwpackages_snapshot_step,
                  "PWpackages 浅克隆缺少按 commit 补取逻辑")

          # 成功构建必须留下可追溯的最终配置记录。
          require("生成最终配置留档" in build, "缺少最终配置留档步骤")
          require("上传最终配置留档" in build, "缺少最终配置 Artifact")
          require("scripts/archive-config.sh" in build, "workflow 未调用配置留档工具")
          for required in (
              "final.config",
              "diffconfig.txt",
              "config-changes.diff",
              "build-info.txt",
              "README.txt",
          ):
              require(required in archive_config, f"配置留档工具缺少 {required}")

          # 固件分发必须经过 manifest / 配置留档 / 附件准备验收。
          # 这里按具体 step 提取条件并逐项检查，不依赖条件顺序、空格或换行。
          bin_upload_step = get_step(build, "上传完整 bin 目录")
          release_assets_step = get_step(build, "准备 Release 附件")
          release_bundle_step = get_step(build, "上传 Release 交接包")
          release_step = get_step(release, "发布固件到 Release")
          release_cleanup_step = get_step(release, "清理旧 Releases")

          for token in (
              "steps.manifest.outputs.status == 'success'",
              "env.UPLOAD_BIN_DIR",
          ):
              require(token in bin_upload_step,
                      f"bin Artifact 缺少 gate：{token}")

          for token in (
              "steps.compile.outputs.status == 'success'",
              "steps.manifest.outputs.status == 'success'",
              "steps.config-record.outputs.status == 'success'",
              "env.UPLOAD_RELEASE == 'true'",
          ):
              require(token in release_assets_step,
                      f"Release 附件准备缺少 gate：{token}")

          require("actions/upload-artifact@v7" in release_bundle_step,
                  "build 未通过 Artifact 交接 Release 附件")
          require("release-bundle" in release_bundle_step,
                  "Release 交接包路径异常")
          require("actions/download-artifact@v8" in release,
                  "release job 未下载 build 交接包")
          require("softprops/action-gh-release" not in release,
                  "release job 仍把写 token 交给第三方 Release Action")
          require("gh release create" in release_step,
                  "release job 未使用 gh CLI 发布 Release")
          require("GH_TOKEN:" in release_step and "secrets.GITHUB_TOKEN" in release_step,
                  "Release 发布步骤缺少写 token")
          require('find "$firmware_root" -type f -name \'openwrt-*squashfs*\'' in release_assets_step,
                  "Release 附件未从真实 target 目录动态发现固件")
          require("release-bundle/assets" in release_assets_step,
                  "Release 附件未进入交接目录")
          require("steps.release-upload.outputs.status == 'success'" in release_cleanup_step,
                  "旧 Release 清理没有绑定本轮 Release 成功状态")
          require("!cancelled()" in release_cleanup_step,
                  "旧 Release 清理缺少 cancelled() 保护")

          # manifest 只能验证 SFT1200 image manifest，不能误取 Packages.manifest。
          require("profile_sanitized" in build, "manifest 未按 SFT1200 profile 精确匹配")
          require("! -name 'Packages.manifest'" in build, "manifest 未排除 Packages.manifest")
          require('awk \'NF >= 3 && $2 == "-" {print $1}\'' in build,
                  "manifest 解析格式与 Siflower 18.06 opkg list-installed 不一致")

          # 每个 diy-part2 功能段只能出现一次，防止分步编辑时把脚本尾部重复拼接。
          sections = re.findall(r'^section "([^"]+)"', diy2, flags=re.MULTILINE)
          duplicates = sorted({name for name in sections if sections.count(name) > 1})
          require(not duplicates, f"diy-part2.sh 存在重复 section：{duplicates}")
          require(sections and sections[-1] == "diy-part2 执行完成",
                  "diy-part2.sh 结尾 section 不完整")

          # 已明确弃用的 trojan-plus 不应再被配置或强制保留。
          for label, text in {
              ".config": config,
              "diy-part2.sh": diy2,
          }.items():
              require("trojan-plus" not in text and "Trojan_Plus" not in text,
                      f"{label} 仍残留 trojan-plus")

          # 失效的 Codeberg 网页地址不能再作为 Makefile 下载源。
          require(
              "codeberg.org/aparcar/openwrt/src/branch/apk/include/openssl-engine.mk"
              not in diy1,
              "diy-part1.sh 仍使用会返回 HTML 的 openssl-engine.mk 地址",
          )

          # update-checker 不应回退到旧 Actions / set-output。
          for bad in (
              "::set-output",
              "peter-evans/repository-dispatch@v1",
              "delete-workflow-runs@main",
          ):
              require(bad not in checker, f"update-checker 仍包含旧逻辑：{bad}")

          print("静态预检通过")
          PY

      - name: 获取 NaiveProxy 官方 digest
        id: naiveproxy-metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          metadata_dir="$RUNNER_TEMP/openwrt-passwall-packages"
          rm -rf "$metadata_dir"
          git clone --depth=1 --branch main \
            https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git \
            "$metadata_dir"
          pwpackages_commit="$(git -C "$metadata_dir" rev-parse HEAD)"
          printf 'pwpackages_commit=%s\n' "$pwpackages_commit" >> "$GITHUB_OUTPUT"
          echo "锁定本轮 Passwall packages 快照：$pwpackages_commit"

          python3 scripts/resolve-naiveproxy-release.py \
            --makefile "$metadata_dir/naiveproxy/Makefile" \
            --arch mipsel_24kc-static \
            --github-output "$GITHUB_OUTPUT"

  build:
    name: 编译 SFT1200 固件
    needs: preflight
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    permissions:
      contents: read
    outputs:
      release_ready: ${{ steps.release-assets.outputs.status }}

    steps:
    - name: 磁盘清理前状态
      run: |
        echo "磁盘清理前空间："
        echo "=============================================================================="
        df -hT
        echo "=============================================================================="

    - name: "优化磁盘空间"
      uses: "hugoalh/disk-space-optimizer-ghaction@v0.8.1"
      with:
        operate_sudo: "True"
        general_include: ".+"
        general_exclude: |-
          ^GCC$
          ^G\+\+$
          Clang
          LLVM
        docker_include: ".+"
        docker_prune: "True"
        docker_clean: "True"
        apt_prune: "True"
        apt_clean: "True"
        homebrew_prune: "True"
        homebrew_clean: "True"
        npm_prune: "True"
        npm_clean: "True"
        os_swap: "True"

    - name: 扩展构建空间
      uses: wekingchen/maximize-build-space@master
      with: 
        root-reserve-mb: 2048
        swap-size-mb: 1
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-docker-images: 'true'

    - name: 磁盘空间准备完成
      run: |
        echo "磁盘空间准备完成："
        echo "=============================================================================="
        df -hT
        echo "=============================================================================="

    - name: 检出仓库
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: 初始化编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        set -Eeuo pipefail

        sudo rm -rf /etc/apt/sources.list.d* /usr/local/lib/android* /etc/docker* /etc/firefox* /etc/mysql* /etc/php* /opt/google* /usr/share/dotnet* /usr/share/google* /usr/share/moby* /usr/share/mysql* /usr/share/php*
        sudo -E apt-get -qq update
        sudo add-apt-repository universe
        sudo apt-get update

        deps_file="$RUNNER_TEMP/openwrt-build-deps.txt"
        deps_url="https://raw.githubusercontent.com/wekingchen/my-file/master/depends-ubuntuLTS"
        echo "下载 OpenWrt 编译依赖列表：$deps_url"
        if ! curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors \
          "$deps_url" -o "$deps_file"; then
          echo "错误：编译依赖列表下载失败"
          exit 1
        fi
        if [ ! -s "$deps_file" ]; then
          echo "错误：编译依赖列表为空"
          exit 1
        fi

        mapfile -t build_deps < <(
          tr -s '[:space:]' '\n' < "$deps_file" |
            sed '/^$/d'
        )
        if [ "${#build_deps[@]}" -eq 0 ]; then
          echo "错误：编译依赖列表解析后为空"
          exit 1
        fi

        required_deps=(build-essential git python3 gcc-multilib)
        for required_dep in "${required_deps[@]}"; do
          if ! printf '%s\n' "${build_deps[@]}" | grep -Fxq "$required_dep"; then
            echo "错误：编译依赖列表缺少关键依赖：$required_dep"
            exit 1
          fi
        done

        echo "准备安装 ${#build_deps[@]} 个编译依赖"
        sudo -E apt-get -qq install "${build_deps[@]}"
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo chown $USER:$GROUPS $GITHUB_WORKSPACE

    - name: 克隆并生成 Siflower 源码
      working-directory: ./
      run: |
        df -hT $PWD
        git clone --depth=1 -b $REPO_BRANCH $REPO_URL openwrt
        cd openwrt

        # setup.py 会在内部 Siflower 仓库应用 patch 并创建 Git 提交。
        # GitHub Runner 不保证预设提交者身份，因此在调用 setup.py 之前显式设置，
        # 并同时导出环境变量，确保 setup.py 创建的子仓库也能继承。
        export GIT_AUTHOR_NAME="GitHub Actions"
        export GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
        export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
        export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
        git config --global user.name "$GIT_AUTHOR_NAME"
        git config --global user.email "$GIT_AUTHOR_EMAIL"

        [ -n "$(git config --global user.name)" ] ||
          { echo "错误：Git user.name 未设置"; exit 1; }
        [ -n "$(git config --global user.email)" ] ||
          { echo "错误：Git user.email 未设置"; exit 1; }

        python3 setup.py -c ./configs/config-siflower-18.x.yml
        cd openwrt-18.06/siflower/openwrt-18.06

        # OpenWrt 18.06 compatibility: current feeds pull dependencies too new for this tree.
        sed -i '/^[[:space:]]*-[[:space:]]*dnsmasq-full[[:space:]]*$/d' profiles/luci.yml
        sed -i '/^[[:space:]]*-[[:space:]]*dnsmasq-full[[:space:]]*$/d' profiles/glinet_sft1200.yml
        sed -i '/^[[:space:]]*-[[:space:]]*dnsmasq-full[[:space:]]*$/d' profiles/glinet_common.yml
        sed -i '/^[[:space:]]*-[[:space:]]*dnsmasq-full[[:space:]]*$/d' profiles/glinet_depends.yml

        python3 "$GITHUB_WORKSPACE/scripts/patch-gen-config.py"
        ./scripts/gen_config.py target_siflower_gl-sft1200 luci

    - name: 加载自定义 Feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/openwrt-18.06/siflower/openwrt-18.06/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt/openwrt-18.06/siflower/openwrt-18.06
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: 更新 Feeds
      run: cd openwrt/openwrt-18.06/siflower/openwrt-18.06 && ./scripts/feeds update -a

    - name: 固定 Passwall Packages 构建快照
      env:
        PWPACKAGES_COMMIT: ${{ needs.preflight.outputs.pwpackages_commit }}
      run: |
        set -Eeuo pipefail
        feed_dir="openwrt/openwrt-18.06/siflower/openwrt-18.06/feeds/PWpackages"

        [[ "$PWPACKAGES_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
          echo "错误：Preflight 返回的 PWpackages commit 非法：$PWPACKAGES_COMMIT" >&2
          exit 1
        }
        [ -d "$feed_dir/.git" ] || {
          echo "错误：PWpackages feed 不存在：$feed_dir" >&2
          exit 1
        }

        if ! git -C "$feed_dir" cat-file -e "$PWPACKAGES_COMMIT^{commit}" 2>/dev/null; then
          echo "当前 feed 浅克隆不包含目标 commit，按 SHA 获取本轮快照"
          git -C "$feed_dir" fetch --depth=1 origin "$PWPACKAGES_COMMIT"
        fi

        git -C "$feed_dir" checkout --detach "$PWPACKAGES_COMMIT"
        actual_commit="$(git -C "$feed_dir" rev-parse HEAD)"
        [ "$actual_commit" = "$PWPACKAGES_COMMIT" ] || {
          echo "错误：PWpackages 快照固定失败：expected=$PWPACKAGES_COMMIT actual=$actual_commit" >&2
          exit 1
        }
        echo "PWpackages 本轮构建快照：$actual_commit"

    - name: 计算 Feeds 缓存指纹
      id: feed-cache
      run: |
        cd openwrt/openwrt-18.06/siflower/openwrt-18.06
        {
          for feed in feeds/*; do
            [ -d "$feed" ] || continue
            if git -C "$feed" rev-parse HEAD >/dev/null 2>&1; then
              printf '%s=%s\n' "$(basename "$feed")" "$(git -C "$feed" rev-parse HEAD)"
            fi
          done
        } | sort | tee /tmp/sft1200-feed-commits.txt
        echo "hash=$(sha256sum /tmp/sft1200-feed-commits.txt | awk '{print $1}')" >> "$GITHUB_OUTPUT"

    - name: 恢复源码下载缓存
      continue-on-error: true
      id: dl-cache
      uses: actions/cache/restore@v6
      with:
        path: openwrt/openwrt-18.06/siflower/openwrt-18.06/dl
        key: sft1200-dl-${{ runner.os }}-${{ steps.feed-cache.outputs.hash }}
        restore-keys: |
          sft1200-dl-${{ runner.os }}-

    - name: 安装 Feeds
      run: cd openwrt/openwrt-18.06/siflower/openwrt-18.06 && ./scripts/feeds install -a

    - name: 加载并应用自定义配置
      id: custom-config
      env:
        NAIVEPROXY_META_VERSION: ${{ needs.preflight.outputs.naiveproxy_version }}
        NAIVEPROXY_META_RELEASE: ${{ needs.preflight.outputs.naiveproxy_release }}
        NAIVEPROXY_META_ASSET: ${{ needs.preflight.outputs.naiveproxy_asset }}
        NAIVEPROXY_META_SHA256: ${{ needs.preflight.outputs.naiveproxy_sha256 }}
        NAIVEPROXY_META_URL: ${{ needs.preflight.outputs.naiveproxy_url }}
      run: |
        [ -e files ] && mv files openwrt/openwrt-18.06/siflower/openwrt-18.06/files

        # 仓库 .config 是长期维护基线。保留原件，并在 diy-part2 / make defconfig
        # 修改前保存快照，供成功构建后生成最终配置留档。
        if [ -e "$CONFIG_FILE" ]; then
          cp "$CONFIG_FILE" "$RUNNER_TEMP/sft1200-repository.config"
          cp "$CONFIG_FILE" openwrt/openwrt-18.06/siflower/openwrt-18.06/.config
        fi
        [ -s "$RUNNER_TEMP/sft1200-repository.config" ] || {
          echo "错误：无法保存仓库 .config 基线" >&2
          exit 1
        }

        chmod +x $DIY_P2_SH
        bash -n "$GITHUB_WORKSPACE/$DIY_P2_SH"

        cd openwrt/openwrt-18.06/siflower/openwrt-18.06

        set +e
        "$GITHUB_WORKSPACE/$DIY_P2_SH" > diy-part2.log 2>&1
        config_status=$?
        set -e

        if [ "$config_status" -ne 0 ]; then
          echo "::group::diy-part2 配置阶段错误摘要"
          grep -nE '(ERROR:|error:|Error [0-9]+|not found|not retained|dependency|recursive dependency|Traceback|SystemExit)' diy-part2.log | tail -n 200 || true
          echo
          echo "diy-part2.log 最后 300 行："
          tail -n 300 diy-part2.log || true
          echo "::endgroup::"
          exit "$config_status"
        fi

        tail -n 80 diy-part2.log || true

    - name: 上传配置失败诊断
      uses: actions/upload-artifact@v7
      if: failure() && steps.custom-config.conclusion == 'failure'
      with:
        name: OpenWrt_config_diagnostics_${{ github.run_number }}
        path: openwrt/openwrt-18.06/siflower/openwrt-18.06/diy-part2.log
        if-no-files-found: ignore
        retention-days: 14

    - name: 计算编译缓存指纹
      id: build-cache
      run: |
        cd openwrt/openwrt-18.06/siflower/openwrt-18.06
        go_head="$(git -C feeds/gl_feed_common/golang rev-parse HEAD)"
        {
          sha256sum .config
          sha256sum "$GITHUB_WORKSPACE/$DIY_P2_SH"
          printf 'feeds=%s\n' "${{ steps.feed-cache.outputs.hash }}"
          printf 'go=%s\n' "$go_head"
        } | sha256sum | awk '{print "hash="$1}' >> "$GITHUB_OUTPUT"
        echo "Go 工具链 HEAD：$go_head"

    - name: 恢复编译缓存
      continue-on-error: true
      id: build-cache-restore
      uses: actions/cache/restore@v6
      with:
        path: |
          openwrt/openwrt-18.06/siflower/openwrt-18.06/staging_dir/host/ccache
          openwrt/openwrt-18.06/siflower/openwrt-18.06/staging_dir/target-*/ccache
          openwrt/openwrt-18.06/siflower/openwrt-18.06/.cache/go-build
        # 同一份最终配置与 feeds 共用同一个缓存，不再按 run_number 每轮复制一份。
        # Go 的 GOCACHE 也放在这里，主要用于 Xray、Hysteria 等 Go 包。
        key: sft1200-buildcache-${{ runner.os }}-${{ steps.build-cache.outputs.hash }}
        restore-keys: |
          sft1200-buildcache-${{ runner.os }}-

    - name: SSH 远程调试（可选）
      uses: P3TERX/ssh2actions@v1.0.0
      if: (github.event.inputs.ssh == 'true' && github.event.inputs.ssh  != 'false') || contains(github.event.action, 'ssh')
      env:
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

    - name: 下载软件包源码
      id: package
      run: |
        cd openwrt/openwrt-18.06/siflower/openwrt-18.06
        make download -j8

    - name: 保存源码下载缓存
      continue-on-error: true
      if: steps.package.conclusion == 'success' && steps.dl-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: openwrt/openwrt-18.06/siflower/openwrt-18.06/dl
        key: sft1200-dl-${{ runner.os }}-${{ steps.feed-cache.outputs.hash }}
        
    - name: 编译固件
      id: compile
      run: |
        cd openwrt/openwrt-18.06/siflower/openwrt-18.06
        echo "使用 $(nproc) 个线程编译"
        echo "已恢复的 ccache 目录："
        du -sh staging_dir/host/ccache staging_dir/target-*/ccache 2>/dev/null || true

        hostpkg_lib="$PWD/staging_dir/hostpkg/lib"
        make_ld_library_path="${hostpkg_lib}${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"

        # 完整编译输出写入 build.log，避免 Actions 页面被巨量日志截断。
        # 只给 make 及其子进程注入 hostpkg 运行时库路径，避免污染同一步骤
        # 中的 grep / tail / ccache，更不会影响后续 Actions 步骤。
        # 后台每 5 分钟输出一次心跳，便于区分“仍在编译”和“进程已经卡住”。
        set +e
        LD_LIBRARY_PATH="$make_ld_library_path" make -j$(nproc) > build.log 2>&1 &
        build_pid=$!

        (
          while kill -0 "$build_pid" 2>/dev/null; do
            sleep 300
            kill -0 "$build_pid" 2>/dev/null || break

            log_size="$(du -h build.log 2>/dev/null | awk '{print $1}')"
            log_mtime="$(stat -c '%y' build.log 2>/dev/null | cut -d'.' -f1)"
            last_line="$(tail -n 1 build.log 2>/dev/null | tr '\n\r' '  ')"

            printf '[编译心跳] %s | PID=%s alive | build.log=%s | mtime=%s | %s\n' \
              "$(date '+%Y-%m-%d %H:%M:%S')" \
              "$build_pid" \
              "${log_size:-0}" \
              "${log_mtime:-unknown}" \
              "${last_line:-暂无新日志}"
          done
        ) &
        heartbeat_pid=$!

        wait "$build_pid"
        build_status=$?

        kill "$heartbeat_pid" 2>/dev/null || true
        wait "$heartbeat_pid" 2>/dev/null || true
        set -e

        if [ "$build_status" -ne 0 ]; then
          echo "::group::并行编译错误摘要"
          grep -nE '(^|[[:space:]])(fatal error:|error:|Error [0-9]+|FAILED:|No rule to make target|undefined reference)' build.log | tail -n 200 || true
          echo
          echo "build.log 最后 200 行："
          tail -n 200 build.log || true
          echo "::endgroup::"

          echo "::group::失败目标诊断重试"

          failed_target="$(
            sed -nE 's/.*ERROR: ((package|tools|toolchain)\/[^[:space:]]+) failed to build.*/\1\/compile/p' build.log |
            tail -n 1
          )"
          if [ -z "$failed_target" ]; then
            failed_target="$(
              grep -Eo '(package|tools|toolchain)/[^[:space:]]+/compile' build.log |
              tail -n 1 || true
            )"
          fi

          diagnostic_timeout="20m"
          set +e
          if [ -n "$failed_target" ]; then
            echo "检测到失败目标：$failed_target"
            echo "仅重跑失败目标，诊断上限：$diagnostic_timeout"
            timeout --signal=TERM --kill-after=1m "$diagnostic_timeout" \
              env LD_LIBRARY_PATH="$make_ld_library_path" \
              make "$failed_target" -j1 V=s > build-failure.log 2>&1
            retry_status=$?
          else
            echo "未能从 build.log 稳定识别失败 package target。"
            echo "执行有限时的全量单线程诊断，最多 $diagnostic_timeout，不允许无限重跑。"
            timeout --signal=TERM --kill-after=1m "$diagnostic_timeout" \
              env LD_LIBRARY_PATH="$make_ld_library_path" \
              make -j1 V=s > build-failure.log 2>&1
            retry_status=$?
          fi
          set -e

          if [ "$retry_status" -eq 124 ] || [ "$retry_status" -eq 137 ]; then
            echo "诊断重试达到 $diagnostic_timeout 超时上限，已终止。"
          fi

          grep -nE '(^|[[:space:]])(fatal error:|error:|Error [0-9]+|FAILED:|No rule to make target|undefined reference)' build-failure.log | tail -n 250 || true
          echo
          echo "build-failure.log 最后 300 行："
          tail -n 300 build-failure.log || true
          echo "诊断重试退出状态：$retry_status"
          echo "::endgroup::"

          exit "$build_status"
        fi

        echo "固件编译完成。"
        echo "build.log 最后 40 行："
        tail -n 40 build.log || true

        if [ -x staging_dir/host/bin/ccache ]; then
          echo "=== ccache 统计 ==="
          for cache_dir in staging_dir/host/ccache staging_dir/target-*/ccache; do
            [ -d "$cache_dir" ] || continue
            echo "--- $cache_dir ---"
            CCACHE_DIR="$cache_dir" staging_dir/host/bin/ccache -s || true
          done
        fi

        echo "status=success" >> $GITHUB_OUTPUT
        profile="$(
          sed -n 's/^CONFIG_TARGET_siflower_sf19a28_fullmask_\(.*\)=y$/\1/p' .config |
          head -n1
        )"
        [ -n "$profile" ] || {
          echo "错误：无法从 .config 识别 SFT1200 profile" >&2
          exit 1
        }
        printf '%s\n' "$profile" > DEVICE_NAME
        echo "DEVICE_NAME=_$profile" >> "$GITHUB_ENV"
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: 保存编译缓存
      continue-on-error: true
      if: steps.compile.outputs.status == 'success' && steps.build-cache-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: |
          openwrt/openwrt-18.06/siflower/openwrt-18.06/staging_dir/host/ccache
          openwrt/openwrt-18.06/siflower/openwrt-18.06/staging_dir/target-*/ccache
          openwrt/openwrt-18.06/siflower/openwrt-18.06/.cache/go-build
        key: sft1200-buildcache-${{ runner.os }}-${{ steps.build-cache.outputs.hash }}

    - name: 校验固件功能完整性
      id: manifest
      if: steps.compile.outputs.status == 'success'
      run: |
        set -Eeuo pipefail
        cd openwrt/openwrt-18.06/siflower/openwrt-18.06

        profile="$(
          sed -n 's/^CONFIG_TARGET_siflower_sf19a28_fullmask_\(.*\)=y$/\1/p' .config |
          head -n1
        )"
        [ -n "$profile" ] || {
          echo "错误：无法从 .config 识别 SFT1200 profile"
          exit 1
        }

        # include/version.mk 中 sanitize 的规则是：转小写、下划线改为连字符。
        profile_sanitized="$(
          printf '%s' "$profile" |
          tr '[:upper:]' '[:lower:]' |
          tr '_' '-'
        )"

        mapfile -t manifests < <(
          find bin/targets/siflower -type f \
            -name "*-${profile_sanitized}.manifest" \
            ! -name 'Packages.manifest' \
            -size +0c -print |
          sort
        )

        if [ "${#manifests[@]}" -ne 1 ]; then
          echo "错误：SFT1200 应只对应 1 份 image manifest，实际找到 ${#manifests[@]} 份"
          echo "当前所有 manifest："
          find bin/targets/siflower -type f -name '*.manifest' -print | sort || true
          exit 1
        fi

        manifest="${manifests[0]}"
        echo "SFT1200 profile：$profile"
        echo "manifest profile：$profile_sanitized"
        echo "固件 manifest：$manifest"
        echo "manifest 前 20 行："
        head -n 20 "$manifest" || true

        # Siflower 18.06 的 Image/Manifest 明确来自 opkg list-installed，
        # 格式固定为：package-name - version。
        awk 'NF >= 3 && $2 == "-" {print $1}' "$manifest" |
          sort -u > /tmp/sft1200-installed-packages.txt

        [ -s /tmp/sft1200-installed-packages.txt ] || {
          echo "错误：image manifest 解析后没有任何已安装包"
          exit 1
        }

        required_packages=(
          luci-app-passwall
          luci-i18n-passwall-zh-cn
          luci-app-ssr-plus
          luci-i18n-ssr-plus-zh-cn
          xray-core
          naiveproxy
          hysteria
          haproxy
          shadowsocks-libev-ss-local
          shadowsocks-libev-ss-redir
          shadowsocksr-libev-ssr-local
          shadowsocksr-libev-ssr-redir
          trojan
          zerotier
          miniupnpd
          luci-app-upnp
          aliyundrive-webdav
        )

        missing=0
        for pkg in "${required_packages[@]}"; do
          if grep -Fxq "$pkg" /tmp/sft1200-installed-packages.txt; then
            printf '通过  %s\n' "$pkg"
          else
            printf '缺失  %s\n' "$pkg"
            missing=1
          fi
        done

        if [ "$missing" -ne 0 ]; then
          echo "错误：编译成功，但关键功能包没有全部进入 SFT1200 最终固件。"
          exit 1
        fi

        echo "固件功能完整性检查通过：$manifest"
        echo "status=success" >> "$GITHUB_OUTPUT"

    - name: 生成最终配置留档
      id: config-record
      if: steps.manifest.outputs.status == 'success'
      env:
        FEED_FINGERPRINT: ${{ steps.feed-cache.outputs.hash }}
        BUILD_CACHE_FINGERPRINT: ${{ steps.build-cache.outputs.hash }}
      run: |
        chmod +x scripts/archive-config.sh
        scripts/archive-config.sh \
          "$RUNNER_TEMP/sft1200-repository.config" \
          "$GITHUB_WORKSPACE/openwrt/openwrt-18.06/siflower/openwrt-18.06/.config" \
          "$GITHUB_WORKSPACE/config-record"
        echo "status=success" >> "$GITHUB_OUTPUT"

    - name: 上传最终配置留档
      uses: actions/upload-artifact@v7
      if: steps.config-record.outputs.status == 'success'
      with:
        name: OpenWrt_config_record${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: config-record
        if-no-files-found: error
        retention-days: 30

    - name: 上传 Manifest 失败诊断
      uses: actions/upload-artifact@v7
      if: failure() && steps.compile.outputs.status == 'success' && steps.manifest.conclusion == 'failure'
      with:
        name: OpenWrt_manifest_diagnostics_${{ github.run_number }}
        path: openwrt/openwrt-18.06/siflower/openwrt-18.06/bin/targets/siflower/**/*.manifest
        if-no-files-found: ignore
        retention-days: 14

    - name: 上传编译失败诊断
      uses: actions/upload-artifact@v7
      if: failure() && steps.compile.conclusion == 'failure'
      with:
        name: OpenWrt_build_diagnostics_${{ github.run_number }}
        path: |
          openwrt/openwrt-18.06/siflower/openwrt-18.06/build.log
          openwrt/openwrt-18.06/siflower/openwrt-18.06/build-failure.log
          openwrt/openwrt-18.06/siflower/openwrt-18.06/logs
        if-no-files-found: ignore
        retention-days: 14

    - name: 检查磁盘占用
      if: (!cancelled())
      run: df -hT

    - name: 上传完整 bin 目录
      uses: actions/upload-artifact@v7
      if: always() && steps.compile.outputs.status == 'success' && steps.manifest.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/openwrt-18.06/siflower/openwrt-18.06/bin

    - name: 整理固件文件
      id: organize
      if: steps.compile.outputs.status == 'success' && steps.manifest.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/openwrt-18.06/siflower/openwrt-18.06/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 上传固件目录
      uses: actions/upload-artifact@v7
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: 上传固件到 CowTransfer
      id: cowtransfer
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_COWTRANSFER == 'true' && !cancelled()
      run: |
        curl -fsSL git.io/file-transfer | sh
        ./transfer cow --block 2621440 -s -p 64 --no-progress ${FIRMWARE} 2>&1 | tee cowtransfer.log
        echo "::warning file=cowtransfer.com::$(cat cowtransfer.log | grep https)"
        echo "url=$(cat cowtransfer.log | grep https | cut -f3 -d" ")" >> $GITHUB_OUTPUT

    - name: 上传固件到 WeTransfer
      id: wetransfer
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_WETRANSFER == 'true' && !cancelled()
      run: |
        curl -fsSL git.io/file-transfer | sh
        ./transfer wet -s -p 16 --no-progress ${FIRMWARE} 2>&1 | tee wetransfer.log
        echo "::warning file=wetransfer.com::$(cat wetransfer.log | grep https)"
        echo "url=$(cat wetransfer.log | grep https | cut -f3 -d" ")" >> $GITHUB_OUTPUT

    - name: 准备 Release 附件
      id: release-assets
      if: steps.compile.outputs.status == 'success' && steps.manifest.outputs.status == 'success' && steps.config-record.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true' && !cancelled()
      env:
        COWTRANSFER_URL: ${{ steps.cowtransfer.outputs.url }}
        WETRANSFER_URL: ${{ steps.wetransfer.outputs.url }}
      run: |
        set -Eeuo pipefail

        firmware_root="openwrt/openwrt-18.06/siflower/openwrt-18.06/bin/targets/siflower"
        rm -rf release-bundle
        mkdir -p release-bundle/assets

        mapfile -d '' -t firmware_files < <(
          find "$firmware_root" -type f -name 'openwrt-*squashfs*' -print0 |
            sort -z
        )
        if [ "${#firmware_files[@]}" -eq 0 ]; then
          echo "错误：未找到可发布的 squashfs 固件文件" >&2
          find "$firmware_root" -maxdepth 2 -type f -print | sort || true
          exit 1
        fi

        echo "准备发布 ${#firmware_files[@]} 个固件文件："
        for file in "${firmware_files[@]}"; do
          echo "  - $file"
          cp -f "$file" release-bundle/assets/
        done

        mapfile -t config_files < <(find config-record -maxdepth 1 -type f -print | sort)
        if [ "${#config_files[@]}" -eq 0 ]; then
          echo "错误：config-record 为空" >&2
          exit 1
        fi
        cp -f "${config_files[@]}" release-bundle/assets/

        {
          echo "SFT1200 自动构建固件。"
          if [ "$UPLOAD_COWTRANSFER" = true ] && [ -n "$COWTRANSFER_URL" ]; then
            printf '\n🔗 [CowTransfer](%s)\n' "$COWTRANSFER_URL"
          fi
          if [ "$UPLOAD_WETRANSFER" = true ] && [ -n "$WETRANSFER_URL" ]; then
            printf '\n🔗 [WeTransfer](%s)\n' "$WETRANSFER_URL"
          fi
        } > release-bundle/release.txt

        echo "Release 附件清单："
        find release-bundle/assets -maxdepth 1 -type f -printf '  - %f\n' | sort
        echo "status=success" >> "$GITHUB_OUTPUT"

    - name: 上传 Release 交接包
      id: release-bundle-upload
      if: steps.release-assets.outputs.status == 'success'
      uses: actions/upload-artifact@v7
      with:
        name: SFT1200_release_bundle_${{ github.run_id }}
        path: release-bundle
        if-no-files-found: error
        retention-days: 1
        compression-level: 0


  release:
    name: 发布 SFT1200 固件
    needs: build
    if: needs.build.result == 'success' && needs.build.outputs.release_ready == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      actions: write
      contents: write

    steps:
    - name: 下载 Release 交接包
      uses: actions/download-artifact@v8
      with:
        name: SFT1200_release_bundle_${{ github.run_id }}
        path: release-bundle

    - name: 校验 Release 交接包
      run: |
        set -Eeuo pipefail
        [ -s release-bundle/release.txt ] || {
          echo "错误：Release 说明文件缺失" >&2
          exit 1
        }
        mapfile -t assets < <(find release-bundle/assets -maxdepth 1 -type f -print | sort)
        [ "${#assets[@]}" -gt 0 ] || {
          echo "错误：Release 交接包没有附件" >&2
          exit 1
        }
        find release-bundle/assets -maxdepth 1 -type f -printf '  - %f\n' | sort

    - name: 发布固件到 Release
      id: release-upload
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -Eeuo pipefail
        release_tag="$(date +"%Y.%m.%d-%H%M")"
        mapfile -t assets < <(find release-bundle/assets -maxdepth 1 -type f -print | sort)

        gh release create "$release_tag" "${assets[@]}" \
          --repo "$GITHUB_REPOSITORY" \
          --target "$GITHUB_SHA" \
          --title "$release_tag" \
          --notes-file release-bundle/release.txt

        echo "发布完成：$release_tag"
        echo "status=success" >> "$GITHUB_OUTPUT"

    - name: 清理旧 Workflow 运行记录
      if: always() && !cancelled()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -Eeuo pipefail
        cutoff_epoch="$(date -u -d '30 days ago' +%s)"

        gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100" \
          --jq '.workflows[].id' |
        while read -r workflow_id; do
          [ -n "$workflow_id" ] || continue

          mapfile -t runs < <(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/runs?per_page=100" \
              --jq '.workflow_runs[] | [.id, .created_at] | @tsv'
          )

          index=0
          for row in "${runs[@]}"; do
            index=$((index + 1))
            [ "$index" -le 10 ] && continue

            run_id="$(printf '%s\n' "$row" | cut -f1)"
            created_at="$(printf '%s\n' "$row" | cut -f2)"
            created_epoch="$(date -u -d "$created_at" +%s)"

            if [ "$created_epoch" -lt "$cutoff_epoch" ]; then
              echo "删除 Workflow 运行记录 ${run_id}（${created_at}）"
              gh api -X DELETE \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" \
                --silent
            fi
          done
        done

    - name: 清理旧 Releases
      if: steps.release-upload.outputs.status == 'success' && !cancelled()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -Eeuo pipefail

        mapfile -t releases < <(
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | [.created_at, .id, .tag_name] | @tsv' |
          sort -r
        )

        index=0
        for row in "${releases[@]}"; do
          index=$((index + 1))
          [ "$index" -le 10 ] && continue

          created_at="$(printf '%s\n' "$row" | cut -f1)"
          release_id="$(printf '%s\n' "$row" | cut -f2)"
          tag_name="$(printf '%s\n' "$row" | cut -f3-)"
          echo "删除 Release ${tag_name}（${created_at}）"

          gh api -X DELETE \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            --silent

          gh api -X DELETE \
            "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag_name}" \
            --silent || true
        done
