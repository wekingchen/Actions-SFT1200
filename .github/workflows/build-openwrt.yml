name: Build OpenWrt

on:
  push:
    branches:
      - test/optimization-20260930
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'

permissions:
  actions: write
  contents: write

concurrency:
  group: sft1200-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REPO_URL: https://github.com/201821143044/gl-infra-builder-new
  REPO_BRANCH: main
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: true
  UPLOAD_FIRMWARE: false
  UPLOAD_COWTRANSFER: false
  UPLOAD_WETRANSFER: false
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  # OpenWrt 18.06 ccache settings. "content" avoids misses when the rebuilt
  # compiler has identical bytes but a different timestamp.
  CCACHE_COMPILERCHECK: content
  CCACHE_MAXSIZE: 512M

jobs:
  preflight:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Static preflight
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "检查 Shell 语法"
          bash -n "$DIY_P1_SH"
          bash -n "$DIY_P2_SH"

          echo "检查已知兼容约束"
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/build-openwrt.yml").read_text()
          checker = Path(".github/workflows/update-checker.yml").read_text()
          diy1 = Path("diy-part1.sh").read_text()
          diy2 = Path("diy-part2.sh").read_text()
          config = Path(".config").read_text()

          # 只检查 build job 正文，避免 Preflight 自己的断言字符串造成自命中。
          marker = "\n  build:\n"
          if marker not in workflow:
              raise SystemExit("PRECHECK ERROR: 找不到 build job")
          build = workflow.split(marker, 1)[1]

          def require(condition, message):
              if not condition:
                  raise SystemExit(f"PRECHECK ERROR: {message}")

          # setup.py 内部会创建 Git 提交，身份必须在调用前设置。
          setup_pos = build.find("python3 setup.py")
          name_pos = build.find('export GIT_AUTHOR_NAME="GitHub Actions"')
          email_pos = build.find('export GIT_AUTHOR_EMAIL=')
          require(setup_pos >= 0, "找不到 setup.py 调用")
          require(0 <= name_pos < setup_pos, "Git author name 没有在 setup.py 前设置")
          require(0 <= email_pos < setup_pos, "Git author email 没有在 setup.py 前设置")

          # cache 必须使用 restore/save 分离模式，避免 post-save 重复逻辑。
          require("actions/cache/restore@v6" in build, "缺少 cache restore")
          require("actions/cache/save@v6" in build, "缺少 cache save")
          require("uses: actions/cache@v6" not in build, "仍存在旧的一体式 cache action")

          # 固件分发必须经过 manifest 验收。
          require(
              "steps.manifest.outputs.status == 'success' && env.UPLOAD_BIN_DIR" in build,
              "bin Artifact 未受 manifest 验收控制",
          )
          require(
              "steps.manifest.outputs.status == 'success' && env.UPLOAD_RELEASE" in build,
              "Release tag 未受 manifest 验收控制",
          )
          require(
              "steps.manifest.outputs.status == 'success' && steps.tag.outputs.status == 'success'"
              in build,
              "Release 上传未受 manifest 验收控制",
          )

          # manifest 只能验证 SFT1200 image manifest，不能误取 Packages.manifest。
          require("profile_sanitized" in build, "manifest 未按 SFT1200 profile 精确匹配")
          require("! -name 'Packages.manifest'" in build, "manifest 未排除 Packages.manifest")
          require('awk \'NF >= 3 && $2 == "-" {print $1}\'' in build,
                  "manifest 解析格式与 Siflower 18.06 opkg list-installed 不一致")

          # 每个 diy-part2 功能段只能出现一次，防止分步编辑时把脚本尾部重复拼接。
          import re
          sections = re.findall(r'^section "([^"]+)"', diy2, flags=re.MULTILINE)
          duplicates = sorted({name for name in sections if sections.count(name) > 1})
          require(not duplicates, f"diy-part2.sh 存在重复 section：{duplicates}")
          require(sections and sections[-1] == "diy-part2 执行完成",
                  "diy-part2.sh 结尾 section 不完整")

          # 已明确弃用的 trojan-plus 不应再被配置或强制保留。
          for label, text in {
              ".config": config,
              "diy-part2.sh": diy2,
          }.items():
              require("trojan-plus" not in text and "Trojan_Plus" not in text,
                      f"{label} 仍残留 trojan-plus")

          # 失效的 Codeberg 网页地址不能再作为 Makefile 下载源。
          require(
              "codeberg.org/aparcar/openwrt/src/branch/apk/include/openssl-engine.mk"
              not in diy1,
              "diy-part1.sh 仍使用会返回 HTML 的 openssl-engine.mk 地址",
          )

          # update-checker 不应回退到旧 Actions / set-output。
          for bad in (
              "::set-output",
              "peter-evans/repository-dispatch@v1",
              "delete-workflow-runs@main",
          ):
              require(bad not in checker, f"update-checker 仍包含旧逻辑：{bad}")

          print("Static preflight OK")
          PY

  build:
    needs: preflight
    runs-on: ubuntu-22.04

    steps:
    - name: Before freeing up disk space
      run: |
        echo "Before freeing up disk space"
        echo "=============================================================================="
        df -hT
        echo "=============================================================================="

    - name: "Optimize Disk Space"
      uses: "hugoalh/disk-space-optimizer-ghaction@v0.8.1"
      with:
        operate_sudo: "True"
        general_include: ".+"
        general_exclude: |-
          ^GCC$
          ^G\+\+$
          Clang
          LLVM
        docker_include: ".+"
        docker_prune: "True"
        docker_clean: "True"
        apt_prune: "True"
        apt_clean: "True"
        homebrew_prune: "True"
        homebrew_clean: "True"
        npm_prune: "True"
        npm_clean: "True"
        os_swap: "True"

    - name: Freeing up disk space
      uses: wekingchen/maximize-build-space@master
      with: 
        root-reserve-mb: 2048
        swap-size-mb: 1
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-docker-images: 'true'

    - name: Free up disk space complete
      run: |
        echo "Free up disk space complete"
        echo "=============================================================================="
        df -hT
        echo "=============================================================================="

    - name: Checkout
      uses: actions/checkout@v7

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d* /usr/local/lib/android* /etc/docker* /etc/firefox* /etc/mysql* /etc/php* /opt/google* /usr/share/dotnet* /usr/share/google* /usr/share/moby* /usr/share/mysql* /usr/share/php*
        sudo -E apt-get -qq update
        sudo add-apt-repository universe
        sudo apt-get update
        sudo -E apt-get -qq install $(curl -fsSL raw.githubusercontent.com/wekingchen/my-file/master/depends-ubuntuLTS)
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo chown $USER:$GROUPS $GITHUB_WORKSPACE

    - name: Clone source code
      working-directory: ./
      run: |
        df -hT $PWD
        git clone --depth=1 -b $REPO_BRANCH $REPO_URL openwrt
        cd openwrt

        # setup.py 会在内部 Siflower 仓库应用 patch 并创建 Git 提交。
        # GitHub Runner 不保证预设提交者身份，因此在调用 setup.py 之前显式设置，
        # 并同时导出环境变量，确保 setup.py 创建的子仓库也能继承。
        export GIT_AUTHOR_NAME="GitHub Actions"
        export GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
        export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
        export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
        git config --global user.name "$GIT_AUTHOR_NAME"
        git config --global user.email "$GIT_AUTHOR_EMAIL"

        [ -n "$(git config --global user.name)" ] ||
          { echo "ERROR: Git user.name 未设置"; exit 1; }
        [ -n "$(git config --global user.email)" ] ||
          { echo "ERROR: Git user.email 未设置"; exit 1; }

        python3 setup.py -c ./configs/config-siflower-18.x.yml
        cd openwrt-18.06/siflower/openwrt-18.06

        # OpenWrt 18.06 compatibility: current feeds pull dependencies too new for this tree.
        sed -i '/^[[:space:]]*-[[:space:]]*dnsmasq-full[[:space:]]*$/d' profiles/luci.yml
        sed -i '/^[[:space:]]*-[[:space:]]*dnsmasq-full[[:space:]]*$/d' profiles/glinet_sft1200.yml
        sed -i '/^[[:space:]]*-[[:space:]]*dnsmasq-full[[:space:]]*$/d' profiles/glinet_common.yml
        sed -i '/^[[:space:]]*-[[:space:]]*dnsmasq-full[[:space:]]*$/d' profiles/glinet_depends.yml

        python3 -c "import base64; exec(base64.b64decode(''))"
        ./scripts/gen_config.py target_siflower_gl-sft1200 luci

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/openwrt-18.06/siflower/openwrt-18.06/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt/openwrt-18.06/siflower/openwrt-18.06
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt/openwrt-18.06/siflower/openwrt-18.06 && ./scripts/feeds update -a

    - name: Compute feed cache fingerprint
      id: feed-cache
      run: |
        cd openwrt/openwrt-18.06/siflower/openwrt-18.06
        {
          for feed in feeds/*; do
            [ -d "$feed" ] || continue
            if git -C "$feed" rev-parse HEAD >/dev/null 2>&1; then
              printf '%s=%s\n' "$(basename "$feed")" "$(git -C "$feed" rev-parse HEAD)"
            fi
          done
        } | sort | tee /tmp/sft1200-feed-commits.txt
        echo "hash=$(sha256sum /tmp/sft1200-feed-commits.txt | awk '{print $1}')" >> "$GITHUB_OUTPUT"

    - name: Restore source download cache
      continue-on-error: true
      id: dl-cache
      uses: actions/cache/restore@v6
      with:
        path: openwrt/openwrt-18.06/siflower/openwrt-18.06/dl
        key: sft1200-dl-${{ runner.os }}-${{ steps.feed-cache.outputs.hash }}
        restore-keys: |
          sft1200-dl-${{ runner.os }}-

    - name: Install feeds
      run: cd openwrt/openwrt-18.06/siflower/openwrt-18.06 && ./scripts/feeds install -a

    - name: Load custom configuration
      id: custom-config
      run: |
        [ -e files ] && mv files openwrt/openwrt-18.06/siflower/openwrt-18.06/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/openwrt-18.06/siflower/openwrt-18.06/.config
        chmod +x $DIY_P2_SH
        bash -n "$GITHUB_WORKSPACE/$DIY_P2_SH"

        cd openwrt/openwrt-18.06/siflower/openwrt-18.06

        set +e
        "$GITHUB_WORKSPACE/$DIY_P2_SH" > diy-part2.log 2>&1
        config_status=$?
        set -e

        if [ "$config_status" -ne 0 ]; then
          echo "::group::diy-part2 配置阶段错误摘要"
          grep -nE '(ERROR:|error:|Error [0-9]+|not found|not retained|dependency|recursive dependency|Traceback|SystemExit)' diy-part2.log | tail -n 200 || true
          echo
          echo "diy-part2.log 最后 300 行："
          tail -n 300 diy-part2.log || true
          echo "::endgroup::"
          exit "$config_status"
        fi

        tail -n 80 diy-part2.log || true

    - name: Upload configuration diagnostics
      uses: actions/upload-artifact@v7
      if: failure() && steps.custom-config.conclusion == 'failure'
      with:
        name: OpenWrt_config_diagnostics_${{ github.run_number }}
        path: openwrt/openwrt-18.06/siflower/openwrt-18.06/diy-part2.log
        if-no-files-found: ignore
        retention-days: 14

    - name: Compute compiler cache fingerprint
      id: build-cache
      run: |
        cd openwrt/openwrt-18.06/siflower/openwrt-18.06
        go_head="$(git -C feeds/gl_feed_common/golang rev-parse HEAD)"
        {
          sha256sum .config
          sha256sum "$GITHUB_WORKSPACE/$DIY_P2_SH"
          printf 'feeds=%s\n' "${{ steps.feed-cache.outputs.hash }}"
          printf 'go=%s\n' "$go_head"
        } | sha256sum | awk '{print "hash="$1}' >> "$GITHUB_OUTPUT"
        echo "Go toolchain HEAD: $go_head"

    - name: Restore compiler cache
      continue-on-error: true
      id: build-cache-restore
      uses: actions/cache/restore@v6
      with:
        path: |
          openwrt/openwrt-18.06/siflower/openwrt-18.06/staging_dir/host/ccache
          openwrt/openwrt-18.06/siflower/openwrt-18.06/staging_dir/target-*/ccache
          openwrt/openwrt-18.06/siflower/openwrt-18.06/.cache/go-build
        # 同一份最终配置与 feeds 共用同一个缓存，不再按 run_number 每轮复制一份。
        # Go 的 GOCACHE 也放在这里，主要用于 Xray、Hysteria 等 Go 包。
        key: sft1200-buildcache-${{ runner.os }}-${{ steps.build-cache.outputs.hash }}
        restore-keys: |
          sft1200-buildcache-${{ runner.os }}-
          sft1200-ccache-${{ runner.os }}-

    - name: SSH connection to Actions
      uses: P3TERX/ssh2actions@v1.0.0
      if: (github.event.inputs.ssh == 'true' && github.event.inputs.ssh  != 'false') || contains(github.event.action, 'ssh')
      env:
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

    - name: Download package
      id: package
      run: |
        cd openwrt/openwrt-18.06/siflower/openwrt-18.06
        make download -j8

    - name: Save source download cache
      continue-on-error: true
      if: steps.package.conclusion == 'success' && steps.dl-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: openwrt/openwrt-18.06/siflower/openwrt-18.06/dl
        key: sft1200-dl-${{ runner.os }}-${{ steps.feed-cache.outputs.hash }}
        
    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt/openwrt-18.06/siflower/openwrt-18.06
        echo "$(nproc) thread compile"
        echo "Restored ccache directories:"
        du -sh staging_dir/host/ccache staging_dir/target-*/ccache 2>/dev/null || true

        # 完整编译输出写入 build.log，避免 Actions 页面被巨量日志截断。
        # 后台每 5 分钟输出一次心跳，便于区分“仍在编译”和“进程已经卡住”。
        set +e
        make -j$(nproc) > build.log 2>&1 &
        build_pid=$!

        (
          while kill -0 "$build_pid" 2>/dev/null; do
            sleep 300
            kill -0 "$build_pid" 2>/dev/null || break

            log_size="$(du -h build.log 2>/dev/null | awk '{print $1}')"
            log_mtime="$(stat -c '%y' build.log 2>/dev/null | cut -d'.' -f1)"
            last_line="$(tail -n 1 build.log 2>/dev/null | tr '\n\r' '  ')"

            printf '[编译心跳] %s | PID=%s alive | build.log=%s | mtime=%s | %s\n' \
              "$(date '+%Y-%m-%d %H:%M:%S')" \
              "$build_pid" \
              "${log_size:-0}" \
              "${log_mtime:-unknown}" \
              "${last_line:-暂无新日志}"
          done
        ) &
        heartbeat_pid=$!

        wait "$build_pid"
        build_status=$?

        kill "$heartbeat_pid" 2>/dev/null || true
        wait "$heartbeat_pid" 2>/dev/null || true
        set -e

        if [ "$build_status" -ne 0 ]; then
          echo "::group::Parallel build error summary"
          grep -nE '(^|[[:space:]])(fatal error:|error:|Error [0-9]+|FAILED:|No rule to make target|undefined reference)' build.log | tail -n 200 || true
          echo
          echo "Last 200 lines of build.log:"
          tail -n 200 build.log || true
          echo "::endgroup::"

          echo "::group::Single-thread diagnostic retry"
          set +e
          make -j1 V=s > build-failure.log 2>&1
          retry_status=$?
          set -e
          grep -nE '(^|[[:space:]])(fatal error:|error:|Error [0-9]+|FAILED:|No rule to make target|undefined reference)' build-failure.log | tail -n 250 || true
          echo
          echo "Last 300 lines of build-failure.log:"
          tail -n 300 build-failure.log || true
          echo "Single-thread retry exit status: $retry_status"
          echo "::endgroup::"

          exit "$build_status"
        fi

        echo "Build completed successfully."
        echo "Last 40 lines of build.log:"
        tail -n 40 build.log || true

        if [ -x staging_dir/host/bin/ccache ]; then
          echo "=== ccache statistics ==="
          for cache_dir in staging_dir/host/ccache staging_dir/target-*/ccache; do
            [ -d "$cache_dir" ] || continue
            echo "--- $cache_dir ---"
            CCACHE_DIR="$cache_dir" staging_dir/host/bin/ccache -s || true
          done
        fi

        echo "status=success" >> $GITHUB_OUTPUT
        profile="$(
          sed -n 's/^CONFIG_TARGET_siflower_sf19a28_fullmask_\(.*\)=y$/\1/p' .config |
          head -n1
        )"
        [ -n "$profile" ] || {
          echo "ERROR: 无法从 .config 识别 SFT1200 profile" >&2
          exit 1
        }
        printf '%s\n' "$profile" > DEVICE_NAME
        echo "DEVICE_NAME=_$profile" >> "$GITHUB_ENV"
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Save compiler cache
      continue-on-error: true
      if: steps.compile.outputs.status == 'success' && steps.build-cache-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: |
          openwrt/openwrt-18.06/siflower/openwrt-18.06/staging_dir/host/ccache
          openwrt/openwrt-18.06/siflower/openwrt-18.06/staging_dir/target-*/ccache
          openwrt/openwrt-18.06/siflower/openwrt-18.06/.cache/go-build
        key: sft1200-buildcache-${{ runner.os }}-${{ steps.build-cache.outputs.hash }}

    - name: Validate firmware manifest
      id: manifest
      if: steps.compile.outputs.status == 'success'
      run: |
        set -Eeuo pipefail
        cd openwrt/openwrt-18.06/siflower/openwrt-18.06

        profile="$(
          sed -n 's/^CONFIG_TARGET_siflower_sf19a28_fullmask_\(.*\)=y$/\1/p' .config |
          head -n1
        )"
        [ -n "$profile" ] || {
          echo "ERROR: 无法从 .config 识别 SFT1200 profile"
          exit 1
        }

        # include/version.mk 中 sanitize 的规则是：转小写、下划线改为连字符。
        profile_sanitized="$(
          printf '%s' "$profile" |
          tr '[:upper:]' '[:lower:]' |
          tr '_' '-'
        )"

        mapfile -t manifests < <(
          find bin/targets/siflower -type f \
            -name "*-${profile_sanitized}.manifest" \
            ! -name 'Packages.manifest' \
            -size +0c -print |
          sort
        )

        if [ "${#manifests[@]}" -ne 1 ]; then
          echo "ERROR: SFT1200 应只对应 1 份 image manifest，实际找到 ${#manifests[@]} 份"
          echo "当前所有 manifest："
          find bin/targets/siflower -type f -name '*.manifest' -print | sort || true
          exit 1
        fi

        manifest="${manifests[0]}"
        echo "SFT1200 profile：$profile"
        echo "manifest profile：$profile_sanitized"
        echo "固件 manifest：$manifest"
        echo "manifest 前 20 行："
        head -n 20 "$manifest" || true

        # Siflower 18.06 的 Image/Manifest 明确来自 opkg list-installed，
        # 格式固定为：package-name - version。
        awk 'NF >= 3 && $2 == "-" {print $1}' "$manifest" |
          sort -u > /tmp/sft1200-installed-packages.txt

        [ -s /tmp/sft1200-installed-packages.txt ] || {
          echo "ERROR: image manifest 解析后没有任何已安装包"
          exit 1
        }

        required_packages=(
          luci-app-passwall
          luci-i18n-passwall-zh-cn
          luci-app-ssr-plus
          luci-i18n-ssr-plus-zh-cn
          xray-core
          naiveproxy
          hysteria
          haproxy
          shadowsocks-libev-ss-local
          shadowsocks-libev-ss-redir
          shadowsocksr-libev-ssr-local
          shadowsocksr-libev-ssr-redir
          trojan
          zerotier
          miniupnpd
          luci-app-upnp
          aliyundrive-webdav
        )

        missing=0
        for pkg in "${required_packages[@]}"; do
          if grep -Fxq "$pkg" /tmp/sft1200-installed-packages.txt; then
            printf 'OK   %s\n' "$pkg"
          else
            printf 'MISS %s\n' "$pkg"
            missing=1
          fi
        done

        if [ "$missing" -ne 0 ]; then
          echo "ERROR: 编译成功，但关键功能包没有全部进入 SFT1200 最终固件。"
          exit 1
        fi

        echo "固件功能完整性检查通过：$manifest"
        echo "status=success" >> "$GITHUB_OUTPUT"

    - name: Upload manifest diagnostics
      uses: actions/upload-artifact@v7
      if: failure() && steps.compile.outputs.status == 'success' && steps.manifest.conclusion == 'failure'
      with:
        name: OpenWrt_manifest_diagnostics_${{ github.run_number }}
        path: openwrt/openwrt-18.06/siflower/openwrt-18.06/bin/targets/siflower/**/*.manifest
        if-no-files-found: ignore
        retention-days: 14

    - name: Upload build diagnostics
      uses: actions/upload-artifact@v7
      if: failure() && steps.compile.conclusion == 'failure'
      with:
        name: OpenWrt_build_diagnostics_${{ github.run_number }}
        path: |
          openwrt/openwrt-18.06/siflower/openwrt-18.06/build.log
          openwrt/openwrt-18.06/siflower/openwrt-18.06/build-failure.log
          openwrt/openwrt-18.06/siflower/openwrt-18.06/logs
        if-no-files-found: ignore
        retention-days: 14

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@v7
      if: always() && steps.compile.outputs.status == 'success' && steps.manifest.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/openwrt-18.06/siflower/openwrt-18.06/bin

    - name: Organize files
      id: organize
      if: steps.compile.outputs.status == 'success' && steps.manifest.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/openwrt-18.06/siflower/openwrt-18.06/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@v7
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Upload firmware to cowtransfer
      id: cowtransfer
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_COWTRANSFER == 'true' && !cancelled()
      run: |
        curl -fsSL git.io/file-transfer | sh
        ./transfer cow --block 2621440 -s -p 64 --no-progress ${FIRMWARE} 2>&1 | tee cowtransfer.log
        echo "::warning file=cowtransfer.com::$(cat cowtransfer.log | grep https)"
        echo "url=$(cat cowtransfer.log | grep https | cut -f3 -d" ")" >> $GITHUB_OUTPUT

    - name: Upload firmware to WeTransfer
      id: wetransfer
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_WETRANSFER == 'true' && !cancelled()
      run: |
        curl -fsSL git.io/file-transfer | sh
        ./transfer wet -s -p 16 --no-progress ${FIRMWARE} 2>&1 | tee wetransfer.log
        echo "::warning file=wetransfer.com::$(cat wetransfer.log | grep https)"
        echo "url=$(cat wetransfer.log | grep https | cut -f3 -d" ")" >> $GITHUB_OUTPUT

    - name: Generate release tag
      id: tag
      if: steps.compile.outputs.status == 'success' && steps.manifest.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        touch release.txt
        [ $UPLOAD_COWTRANSFER = true ] && echo "🔗 [Cowtransfer](${{ steps.cowtransfer.outputs.url }})" >> release.txt
        [ $UPLOAD_WETRANSFER = true ] && echo "🔗 [WeTransfer](${{ steps.wetransfer.outputs.url }})" >> release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v3
      if: steps.compile.outputs.status == 'success' && steps.manifest.outputs.status == 'success' && steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: /home/runner/work/Actions-SFT1200/Actions-SFT1200/openwrt/openwrt-18.06/siflower/openwrt-18.06/bin/targets/siflower/openwrt-*squashfs*

    - name: Delete old workflow runs
      if: always() && !cancelled()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -Eeuo pipefail
        cutoff_epoch="$(date -u -d '30 days ago' +%s)"

        gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100" \
          --jq '.workflows[].id' |
        while read -r workflow_id; do
          [ -n "$workflow_id" ] || continue

          mapfile -t runs < <(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/runs?per_page=100" \
              --jq '.workflow_runs[] | [.id, .created_at] | @tsv'
          )

          index=0
          for row in "${runs[@]}"; do
            index=$((index + 1))
            [ "$index" -le 10 ] && continue

            run_id="$(printf '%s\n' "$row" | cut -f1)"
            created_at="$(printf '%s\n' "$row" | cut -f2)"
            created_epoch="$(date -u -d "$created_at" +%s)"

            if [ "$created_epoch" -lt "$cutoff_epoch" ]; then
              echo "Delete workflow run ${run_id} (${created_at})"
              gh api -X DELETE \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" \
                --silent
            fi
          done
        done

    - name: Remove old Releases
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -Eeuo pipefail

        # GitHub returns releases newest first, but sorting by created_at makes
        # the retention rule explicit and independent of API ordering.
        mapfile -t releases < <(
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | [.created_at, .id, .tag_name] | @tsv' |
          sort -r
        )

        index=0
        for row in "${releases[@]}"; do
          index=$((index + 1))
          [ "$index" -le 10 ] && continue

          created_at="$(printf '%s\n' "$row" | cut -f1)"
          release_id="$(printf '%s\n' "$row" | cut -f2)"
          tag_name="$(printf '%s\n' "$row" | cut -f3-)"
          echo "Delete release ${tag_name} (${created_at})"

          gh api -X DELETE \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            --silent

          # Match the previous action's delete_tags=true behavior.
          gh api -X DELETE \
            "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag_name}" \
            --silent || true
        done
