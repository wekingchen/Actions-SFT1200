#
# SFT1200 上游更新检查
# 监控 Passwall packages main 分支；发现新提交后触发主构建工作流。
#

name: Update Checker

on:
  workflow_dispatch:
  schedule:
    - cron: '40 */12 * * *'

permissions:
  actions: write
  contents: write

env:
  REPO_URL: https://github.com/Openwrt-Passwall/openwrt-passwall-packages
  REPO_BRANCH: main

jobs:
  check:
    runs-on: ubuntu-22.04

    steps:
      - name: Get upstream commit
        id: upstream
        run: |
          set -Eeuo pipefail
          commit_hash="$(
            git ls-remote "$REPO_URL" "refs/heads/$REPO_BRANCH" |
            awk '{print $1}'
          )"
          [ -n "$commit_hash" ]
          echo "commit_hash=$commit_hash" >> "$GITHUB_OUTPUT"
          echo "Passwall packages HEAD: $commit_hash"

      - name: Check whether this commit was seen
        id: upstream-cache
        uses: actions/cache@v6
        with:
          path: .upstream-commit
          key: passwall-packages-${{ steps.upstream.outputs.commit_hash }}

      - name: Record new upstream commit
        if: steps.upstream-cache.outputs.cache-hit != 'true'
        run: |
          printf '%s\n' '${{ steps.upstream.outputs.commit_hash }}' > .upstream-commit

      - name: Trigger OpenWrt build
        if: steps.upstream-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST \
            "repos/${GITHUB_REPOSITORY}/dispatches" \
            -f event_type='Source Code Update' \
            --silent

      - name: Clean old checker runs
        if: always() && !cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          cutoff_epoch="$(date -u -d '1 day ago' +%s)"

          mapfile -t runs < <(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/update-checker.yml/runs?per_page=100" \
              --jq '.workflow_runs[] | [.id, .created_at] | @tsv'
          )

          index=0
          for row in "${runs[@]}"; do
            index=$((index + 1))
            [ "$index" -le 10 ] && continue

            run_id="$(printf '%s\n' "$row" | cut -f1)"
            created_at="$(printf '%s\n' "$row" | cut -f2)"
            created_epoch="$(date -u -d "$created_at" +%s)"

            if [ "$created_epoch" -lt "$cutoff_epoch" ]; then
              echo "Delete checker run ${run_id} (${created_at})"
              gh api -X DELETE \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" \
                --silent
            fi
          done
