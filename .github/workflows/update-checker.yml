#
# SFT1200 上游更新检查
# 监控 Passwall packages/UI 与 helloworld；发现新提交后触发主构建工作流。
#

name: SFT1200 上游更新检查

on:
  workflow_dispatch:
  schedule:
    - cron: '40 */12 * * *'

permissions:
  actions: write
  contents: write

env:
  PASSWALL_PACKAGES_REPO: https://github.com/Openwrt-Passwall/openwrt-passwall-packages
  PASSWALL_UI_REPO: https://github.com/Openwrt-Passwall/openwrt-passwall
  HELLOWORLD_REPO: https://github.com/fw876/helloworld
  PASSWALL_BRANCH: main
  HELLOWORLD_BRANCH: master

jobs:
  check:
    name: 检查代理组件上游
    runs-on: ubuntu-22.04

    steps:
      - name: 获取上游最新提交
        id: upstream
        run: |
          set -Eeuo pipefail

          packages_hash="$(
            git ls-remote "$PASSWALL_PACKAGES_REPO" "refs/heads/$PASSWALL_BRANCH" |
            awk '{print $1}'
          )"
          ui_hash="$(
            git ls-remote "$PASSWALL_UI_REPO" "refs/heads/$PASSWALL_BRANCH" |
            awk '{print $1}'
          )"
          helloworld_hash="$(
            git ls-remote "$HELLOWORLD_REPO" "refs/heads/$HELLOWORLD_BRANCH" |
            awk '{print $1}'
          )"

          [ -n "$packages_hash" ] && [ -n "$ui_hash" ] && [ -n "$helloworld_hash" ]
          combined_hash="$(
            printf '%s\n%s\n%s\n' "$packages_hash" "$ui_hash" "$helloworld_hash" |
            sha256sum |
            awk '{print $1}'
          )"

          echo "combined_hash=$combined_hash" >> "$GITHUB_OUTPUT"
          echo "Passwall packages 最新提交：$packages_hash"
          echo "Passwall UI 最新提交：      $ui_hash"
          echo "helloworld 最新提交：       $helloworld_hash"
          echo "上游组合指纹：              $combined_hash"

      - name: 检查当前上游版本是否已处理
        id: upstream-cache
        uses: actions/cache/restore@v6
        with:
          path: .upstream-commit
          key: proxy-upstream-${{ steps.upstream.outputs.combined_hash }}

      - name: 记录新的上游版本
        if: steps.upstream-cache.outputs.cache-hit != 'true'
        run: |
          printf '%s\n' '${{ steps.upstream.outputs.combined_hash }}' > .upstream-commit

      - name: 触发 SFT1200 固件编译
        id: trigger-build
        if: steps.upstream-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST \
            "repos/${GITHUB_REPOSITORY}/dispatches" \
            -f event_type='Source Code Update' \
            --silent

      - name: 保存上游版本状态
        if: steps.upstream-cache.outputs.cache-hit != 'true' && steps.trigger-build.conclusion == 'success'
        uses: actions/cache/save@v6
        with:
          path: .upstream-commit
          key: proxy-upstream-${{ steps.upstream.outputs.combined_hash }}

      - name: 清理旧检查记录
        if: always() && !cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          cutoff_epoch="$(date -u -d '1 day ago' +%s)"

          mapfile -t runs < <(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/update-checker.yml/runs?per_page=100" \
              --jq '.workflow_runs[] | [.id, .created_at] | @tsv'
          )

          index=0
          for row in "${runs[@]}"; do
            index=$((index + 1))
            [ "$index" -le 10 ] && continue

            run_id="$(printf '%s\n' "$row" | cut -f1)"
            created_at="$(printf '%s\n' "$row" | cut -f2)"
            created_epoch="$(date -u -d "$created_at" +%s)"

            if [ "$created_epoch" -lt "$cutoff_epoch" ]; then
              echo "删除旧检查记录 ${run_id}（${created_at}）"
              gh api -X DELETE \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" \
                --silent
            fi
          done
