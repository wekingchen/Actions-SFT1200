#
# SFT1200 上游更新检查
# 监控 Passwall packages main 分支；发现新提交后触发主构建工作流。
#

name: Update Checker

on:
  workflow_dispatch:
  schedule:
    - cron: '40 */12 * * *'

permissions:
  actions: write
  contents: write

env:
  PASSWALL_PACKAGES_REPO: https://github.com/Openwrt-Passwall/openwrt-passwall-packages
  PASSWALL_UI_REPO: https://github.com/Openwrt-Passwall/openwrt-passwall
  REPO_BRANCH: main

jobs:
  check:
    runs-on: ubuntu-22.04

    steps:
      - name: Get upstream commits
        id: upstream
        run: |
          set -Eeuo pipefail

          packages_hash="$(
            git ls-remote "$PASSWALL_PACKAGES_REPO" "refs/heads/$REPO_BRANCH" |
            awk '{print $1}'
          )"
          ui_hash="$(
            git ls-remote "$PASSWALL_UI_REPO" "refs/heads/$REPO_BRANCH" |
            awk '{print $1}'
          )"

          [ -n "$packages_hash" ] && [ -n "$ui_hash" ]
          combined_hash="$(printf '%s\n%s\n' "$packages_hash" "$ui_hash" | sha256sum | awk '{print $1}')"

          echo "combined_hash=$combined_hash" >> "$GITHUB_OUTPUT"
          echo "Passwall packages HEAD: $packages_hash"
          echo "Passwall UI HEAD:       $ui_hash"
          echo "Combined fingerprint:   $combined_hash"

      - name: Check whether these commits were seen
        id: upstream-cache
        uses: actions/cache/restore@v6
        with:
          path: .upstream-commit
          key: passwall-upstream-${{ steps.upstream.outputs.combined_hash }}

      - name: Record new upstream commit
        if: steps.upstream-cache.outputs.cache-hit != 'true'
        run: |
          printf '%s\n' '${{ steps.upstream.outputs.combined_hash }}' > .upstream-commit

      - name: Trigger OpenWrt build
        id: trigger-build
        if: steps.upstream-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST \
            "repos/${GITHUB_REPOSITORY}/dispatches" \
            -f event_type='Source Code Update' \
            --silent

      - name: Save upstream state
        if: steps.upstream-cache.outputs.cache-hit != 'true' && steps.trigger-build.conclusion == 'success'
        uses: actions/cache/save@v6
        with:
          path: .upstream-commit
          key: passwall-upstream-${{ steps.upstream.outputs.combined_hash }}

      - name: Clean old checker runs
        if: always() && !cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          cutoff_epoch="$(date -u -d '1 day ago' +%s)"

          mapfile -t runs < <(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/update-checker.yml/runs?per_page=100" \
              --jq '.workflow_runs[] | [.id, .created_at] | @tsv'
          )

          index=0
          for row in "${runs[@]}"; do
            index=$((index + 1))
            [ "$index" -le 10 ] && continue

            run_id="$(printf '%s\n' "$row" | cut -f1)"
            created_at="$(printf '%s\n' "$row" | cut -f2)"
            created_epoch="$(date -u -d "$created_at" +%s)"

            if [ "$created_epoch" -lt "$cutoff_epoch" ]; then
              echo "Delete checker run ${run_id} (${created_at})"
              gh api -X DELETE \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" \
                --silent
            fi
          done
